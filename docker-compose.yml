services:
  morpheus-ai:
    build: .
    image: morpheus-ai:latest
    container_name: morpheus-ai
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    # TMS token + chat/completions ayarları (bkz. .env.example)
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    # Kurum içi CA sertifikası gerekiyorsa:
    # volumes:
    #   - ./certs/kurum-ca.pem:/certs/kurum-ca.pem:ro
    # environment:
    #   NODE_EXTRA_CA_CERTS: /certs/kurum-ca.pem
